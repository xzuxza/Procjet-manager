<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workspace — System Zarządzania</title>
    <!-- Google Fonts & Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
        }
        .sidebar-item-active {
            background-color: #0f172a;
            color: #ffffff;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col md:flex-row">

    <!-- PANEL BOCZNY (Sidebar) -->
    <aside class="w-full md:w-72 bg-white border-r border-slate-200 p-6 flex flex-col justify-between shrink-0">
        <div>
            <!-- Nagłówek panelu -->
            <div class="flex items-center gap-3 mb-8">
                <div class="w-8 h-8 rounded-lg bg-slate-900 text-white flex items-center justify-center font-bold text-sm">W</div>
                <div>
                    <h1 class="font-bold text-slate-900 text-base">Workspace</h1>
                    <p class="text-xs text-slate-400">Cele & Projekty</p>
                </div>
            </div>

            <!-- Sekcja projektów -->
            <div class="flex justify-between items-center mb-3">
                <span class="text-xs font-semibold uppercase tracking-wider text-slate-400">Projekty</span>
                <button onclick="openProjectModal()" class="text-xs text-slate-600 hover:text-slate-900 font-semibold bg-slate-100 hover:bg-slate-200 px-2 py-1 rounded-md transition-colors">
                    + Nowy
                </button>
            </div>
            
            <div id="projects-list" class="space-y-1 mb-6">
                <!-- Tutaj wpadną projekty -->
            </div>
        </div>

        <div class="border-t border-slate-100 pt-4 text-xs text-slate-400">
            System organizacji celów v2.0
        </div>
    </aside>

    <!-- GŁÓWNA TREŚĆ -->
    <main class="flex-1 p-6 md:p-10 overflow-y-auto">
        <!-- Aktywny projekt i widok Kanban -->
        <div id="active-project-container" class="hidden">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-8 gap-4 border-b border-slate-200 pb-6">
                <div>
                    <div class="flex items-center gap-3">
                        <h2 id="active-project-title" class="text-2xl font-bold text-slate-900"></h2>
                        <button onclick="deleteActiveProject()" class="text-xs text-slate-400 hover:text-rose-600 transition-colors" title="Usuń projekt">🗑️</button>
                    </div>
                    <p class="text-sm text-slate-500 mt-1">Zarządzaj zadaniami i mniejszymi krokami</p>
                </div>
                <button onclick="openTaskModal()" class="bg-slate-900 hover:bg-slate-800 text-white font-medium px-4 py-2.5 rounded-xl text-sm shadow-sm transition-all flex items-center gap-2">
                    <span>+ Dodaj główne zadanie</span>
                </button>
            </div>

            <!-- Tablica Kanban (3 kolumny w profesjonalnym stylu) -->
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <!-- Kolumna: Do podjęcia -->
                <div class="bg-slate-100/70 rounded-2xl p-4 border border-slate-200/60">
                    <div class="flex justify-between items-center mb-4 px-1">
                        <h3 class="font-semibold text-slate-700 text-sm flex items-center gap-2">
                            <span class="w-2 h-2 rounded-full bg-slate-400"></span> Do podjęcia
                        </h3>
                        <span id="count-todo" class="bg-slate-200 text-slate-700 text-xs px-2 py-0.5 rounded-full font-medium">0</span>
                    </div>
                    <div id="column-todo" class="space-y-3 min-h-[300px]"></div>
                </div>

                <!-- Kolumna: W trakcie -->
                <div class="bg-slate-100/70 rounded-2xl p-4 border border-slate-200/60">
                    <div class="flex justify-between items-center mb-4 px-1">
                        <h3 class="font-semibold text-slate-700 text-sm flex items-center gap-2">
                            <span class="w-2 h-2 rounded-full bg-amber-500"></span> W trakcie
                        </h3>
                        <span id="count-inprogress" class="bg-amber-100 text-amber-700 text-xs px-2 py-0.5 rounded-full font-medium">0</span>
                    </div>
                    <div id="column-inprogress" class="space-y-3 min-h-[300px]"></div>
                </div>

                <!-- Kolumna: Zrobione -->
                <div class="bg-slate-100/70 rounded-2xl p-4 border border-slate-200/60">
                    <div class="flex justify-between items-center mb-4 px-1">
                        <h3 class="font-semibold text-slate-700 text-sm flex items-center gap-2">
                            <span class="w-2 h-2 rounded-full bg-emerald-500"></span> Zrobione
                        </h3>
                        <span id="count-done" class="bg-emerald-100 text-emerald-700 text-xs px-2 py-0.5 rounded-full font-medium">0</span>
                    </div>
                    <div id="column-done" class="space-y-3 min-h-[300px]"></div>
                </div>
            </div>
        </div>

        <!-- Stan pusty -->
        <div id="empty-state" class="text-center py-24 bg-white rounded-2xl border border-slate-200 shadow-sm max-w-xl mx-auto mt-12">
            <div class="w-12 h-12 bg-slate-100 text-slate-400 rounded-xl flex items-center justify-center mx-auto mb-4 font-bold text-lg">📁</div>
            <h3 class="text-lg font-semibold text-slate-800">Brak wybranego projektu</h3>
            <p class="text-sm text-slate-500 mt-1 mb-6">Wybierz projekt z menu po lewej stronie lub stwórz nowy.</p>
            <button onclick="openProjectModal()" class="bg-slate-900 hover:bg-slate-800 text-white font-medium px-5 py-2.5 rounded-xl text-sm transition-all">
                Stwórz projekt
            </button>
        </div>
    </main>

    <!-- Modal: Nowy Projekt -->
    <div id="project-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-xs hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl p-6 max-w-sm w-full shadow-xl border border-slate-100">
            <h3 class="text-lg font-bold text-slate-900 mb-4">Nowy projekt</h3>
            <form onsubmit="handleCreateProject(event)">
                <div class="mb-4">
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Nazwa projektu</label>
                    <input type="text" id="project-name" required placeholder="np. Via Ferraty 🧗‍♀️" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-slate-900">
                </div>
                <div class="flex justify-end gap-2 mt-6">
                    <button type="button" onclick="closeProjectModal()" class="px-4 py-2 text-slate-500 hover:text-slate-800 text-sm font-medium">Anuluj</button>
                    <button type="submit" class="bg-slate-900 hover:bg-slate-800 text-white text-sm font-medium px-4 py-2 rounded-xl">Utwórz</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal: Nowe Zadanie (Główne zadanie + podzadania) -->
    <div id="task-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-xs hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl p-6 max-w-md w-full shadow-xl border border-slate-100 max-h-[90vh] overflow-y-auto">
            <h3 class="text-lg font-bold text-slate-900 mb-4">Nowe zadanie główne</h3>
            <form onsubmit="handleCreateTask(event)">
                <div class="mb-4">
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Tytuł zadania</label>
                    <input type="text" id="task-title" required placeholder="np. Zakup sprzętu wspinaczkowego" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-slate-900">
                </div>
                <div class="mb-4">
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Deadline</label>
                    <input type="date" id="task-deadline" required class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-slate-900">
                </div>
                <div class="mb-4">
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Etap początkowy</label>
                    <select id="task-status" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-slate-900 bg-white">
                        <option value="todo">Do podjęcia</option>
                        <option value="inprogress">W trakcie</option>
                        <option value="done">Zrobione</option>
                    </select>
                </div>
                <div class="mb-4">
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Mniejsze kroki / podzadania (wpisz każde w nowej linijce)</label>
                    <textarea id="task-subtasks" rows="3" placeholder="np.&#10;Sprawdzić ceny w sklepie X&#10;Przymierzyć kask w sklepie stacjonarnym&#10;Zamówić online" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-slate-900"></textarea>
                </div>
                <div class="flex justify-end gap-2 mt-6">
                    <button type="button" onclick="closeTaskModal()" class="px-4 py-2 text-slate-500 hover:text-slate-800 text-sm font-medium">Anuluj</button>
                    <button type="submit" class="bg-slate-900 hover:bg-slate-800 text-white text-sm font-medium px-4 py-2 rounded-xl">Dodaj zadanie</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Skrypt aplikacji -->
    <script>
        let data = JSON.parse(localStorage.getItem('pro_tasks_app_data')) || {
            projects: [],
            activeProjectId: null
        };

        function saveData() {
            localStorage.setItem('pro_tasks_app_data', JSON.stringify(data));
            render();
        }

        function openProjectModal() { document.getElementById('project-modal').classList.remove('hidden'); }
        function closeProjectModal() { document.getElementById('project-modal').classList.add('hidden'); document.getElementById('project-name').value = ''; }
        
        function openTaskModal() { document.getElementById('task-modal').classList.remove('hidden'); }
        function closeTaskModal() { 
            document.getElementById('task-modal').classList.add('hidden'); 
            document.getElementById('task-title').value = ''; 
            document.getElementById('task-deadline').value = ''; 
            document.getElementById('task-subtasks').value = ''; 
        }

        function handleCreateProject(e) {
            e.preventDefault();
            const name = document.getElementById('project-name').value;
            const newProj = {
                id: 'proj_' + Date.now(),
                name: name,
                tasks: []
            };
            data.projects.push(newProj);
            if (!data.activeProjectId) data.activeProjectId = newProj.id;
            closeProjectModal();
            saveData();
        }

        function deleteActiveProject() {
            if (confirm('Usunąć ten projekt wraz ze wszystkimi zadaniami?')) {
                data.projects = data.projects.filter(p => p.id !== data.activeProjectId);
                data.activeProjectId = data.projects.length > 0 ? data.projects[0].id : null;
                saveData();
            }
        }

        function handleCreateTask(e) {
            e.preventDefault();
            const title = document.getElementById('task-title').value;
            const deadline = document.getElementById('task-deadline').value;
            const status = document.getElementById('task-status').value;
            const subtasksRaw = document.getElementById('task-subtasks').value;

            // Parsowanie podzadań z linii tekstu
            const subtasks = subtasksRaw
                .split('\n')
                .map(s => s.trim())
                .filter(s => s.length > 0)
                .map(s => ({ id: 'sub_' + Math.random(), title: s, completed: false }));

            const proj = data.projects.find(p => p.id === data.activeProjectId);
            if (proj) {
                proj.tasks.push({
                    id: 'task_' + Date.now(),
                    title,
                    deadline,
                    status,
                    subtasks
                });
            }
            closeTaskModal();
            saveData();
        }

        function toggleSubtask(taskId, subtaskId) {
            const proj = data.projects.find(p => p.id === data.activeProjectId);
            if (proj) {
                const task = proj.tasks.find(t => t.id === taskId);
                if (task) {
                    const sub = task.subtasks.find(s => s.id === subtaskId);
                    if (sub) {
                        sub.completed = !sub.completed;
                        saveData();
                    }
                }
            }
        }

        function moveTask(taskId, newStatus) {
            const proj = data.projects.find(p => p.id === data.activeProjectId);
            if (proj) {
                const task = proj.tasks.find(t => t.id === taskId);
                if (task) task.status = newStatus;
                saveData();
            }
        }

        function deleteTask(taskId) {
            const proj = data.projects.find(p => p.id === data.activeProjectId);
            if (proj) {
                proj.tasks = proj.tasks.filter(t => t.id !== taskId);
                saveData();
            }
        }

        function setActiveProject(id) {
            data.activeProjectId = id;
            saveData();
        }

        function render() {
            const projectsListEl = document.getElementById('projects-list');
            const activeContainerEl = document.getElementById('active-project-container');
            const emptyStateEl = document.getElementById('empty-state');

            projectsListEl.innerHTML = '';

            if (data.projects.length === 0) {
                activeContainerEl.classList.add('hidden');
                emptyStateEl.classList.remove('hidden');
                return;
            }

            emptyStateEl.classList.add('hidden');
            activeContainerEl.classList.remove('hidden');

            // Renderowanie menu bocznego projektów
            data.projects.forEach(proj => {
                const isActive = proj.id === data.activeProjectId;
                const btn = document.createElement('button');
                btn.className = `w-full text-left px-3.5 py-2 rounded-xl text-sm font-medium transition-all flex items-center justify-between ${isActive ? 'sidebar-item-active shadow-xs' : 'text-slate-600 hover:bg-slate-100'}`;
                btn.innerHTML = `<span>${escapeHtml(proj.name)}</span>`;
                btn.onclick = () => setActiveProject(proj.id);
                projectsListEl.appendChild(btn);
            });

            const activeProj = data.projects.find(p => p.id === data.activeProjectId);
            if (!activeProj) return;

            document.getElementById('active-project-titleinnerText') || (document.getElementById('active-project-title').innerText = activeProj.name);

            const colTodo = document.getElementById('column-todo');
            const colInProgress = document.getElementById('column-inprogress');
            const colDone = document.getElementById('column-done');

            colTodo.innerHTML = '';
            colInProgress.innerHTML = '';
            colDone.innerHTML = '';

            let counts = { todo: 0, inprogress: 0, done: 0 };

            activeProj.tasks.forEach(task => {
                counts[task.status]++;
                const card = document.createElement('div');
                card.className = 'bg-white p-4 rounded-xl border border-slate-200/80 shadow-xs relative group transition-all hover:shadow-md';
                
                const today = new Date().toISOString().split('T')[0];
                const isOverdue = task.deadline < today && task.status !== 'done';

                // Generowanie HTML dla podzadań
                let subtasksHtml = '';
                if (task.subtasks && task.subtasks.length > 0) {
                    subtasksHtml = '<div class="mt-3 pt-3 border-t border-slate-100 space-y-1.5">';
                    task.subtasks.forEach(sub => {
                        subtasksHtml += `
                            <label class="flex items-center gap-2 text-xs text-slate-600 cursor-pointer hover:text-slate-900">
                                <input type="checkbox" ${sub.completed ? 'checked' : ''} onchange="toggleSubtask('${task.id}', '${sub.id}')" class="rounded border-slate-300 text-slate-900 focus:ring-0">
                                <span class="${sub.completed ? 'line-through text-slate-400' : ''}">${escapeHtml(sub.title)}</span>
                            </label>
                        `;
                    });
                    subtasksHtml += '</div>';
                }

                card.innerHTML = `
                    <div class="flex justify-between items-start gap-2 mb-2">
                        <span class="font-semibold text-slate-900 text-sm">${escapeHtml(task.title)}</span>
                        <button onclick="deleteTask('${task.id}')" class="text-slate-300 hover:text-rose-600 text-xs transition-colors">✕</button>
                    </div>
                    
                    ${subtasksHtml}

                    <div class="flex justify-between items-center text-xs mt-4 pt-2 border-t border-slate-50">
                        <span class="${isOverdue ? 'text-rose-600 font-semibold bg-rose-50 px-2 py-0.5 rounded' : 'text-slate-400'}">
                            📅 ${task.deadline} ${isOverdue ? '⚠️' : ''}
                        </span>
                        <div class="flex gap-1">
                            ${task.status !== 'todo' ? `<button onclick="moveTask('${task.id}', 'todo')" title="Do podjęcia" class="px-1.5 py-1 rounded bg-slate-50 hover:bg-slate-100 text-[10px]">⬅️</button>` : ''}
                            ${task.status !== 'inprogress' ? `<button onclick="moveTask('${task.id}', 'inprogress')" title="W trakcie" class="px-1.5 py-1 rounded bg-slate-50 hover:bg-slate-100 text-[10px]">⚡</button>` : ''}
                            ${task.status !== 'done' ? `<button onclick="moveTask('${task.id}', 'done')" title="Zrobione" class="px-1.5 py-1 rounded bg-slate-50 hover:bg-slate-100 text-[10px]">✅</button>` : ''}
                        </div>
                    </div>
                `;

                if (task.status === 'todo') colTodo.appendChild(card);
                else if (task.status === 'inprogress') colInProgress.appendChild(card);
                else if (task.status === 'done') colDone.appendChild(card);
            });

            document.getElementById('count-todo').innerText = counts.todo;
            document.getElementById('count-inprogress').innerText = counts.inprogress;
            document.getElementById('count-done').innerText = counts.done;
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        render();
    </script>
</body>
</html>
